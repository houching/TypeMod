[package]
name = "segoeui-changer"
version = "0.1.0"
edition = "2024"
description = "Windows system font replacement and metrics tool in Rust + GPUI with English/Latin + Khmer support"

[dependencies]
anyhow = "1.0"
gpui = "0.2.2"
read-fonts = "0.47.0"
rfd = "0.18.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
write-fonts = { version = "0.56.0", features = ["read"] }

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
