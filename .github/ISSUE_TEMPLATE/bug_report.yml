name: Bug Report
description: Report a bug or unexpected behavior in TypeMod
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Select Latin font ...
        2. Click Build ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TypeMod Version
      placeholder: e.g. v0.1.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows Version
      placeholder: e.g. Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log Drawer Output
      description: Paste relevant output from the in-app Log Drawer (if available).
      render: text
