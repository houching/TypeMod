name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  check:
    name: Test & Clippy (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.9.1"

      - name: Cache Cargo registry & git
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "check-registry"
          cache-directories: ""
          cache-on-failure: true

      - name: Run unit tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

  release:
    name: Build & Package Release (Windows x64)
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.9.1"

      - name: Cache Cargo registry & git
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-registry"
          cache-directories: ""
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release archive & SHA256
        shell: pwsh
        run: |
          $dist = "dist/segoeui-changer"
          New-Item -ItemType Directory -Force -Path "$dist/scripts" | Out-Null
          Copy-Item "target/release/segoeui-changer.exe" "$dist/"
          Copy-Item "scripts/*.py" "$dist/scripts/"
          Copy-Item "README.md" "$dist/"
          Compress-Archive -Path "$dist/*" -DestinationPath "segoeui-changer-windows-x64.zip" -CompressionLevel Optimal -Force
          $hash = (Get-FileHash "segoeui-changer-windows-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  segoeui-changer-windows-x64.zip" | Out-File -Encoding ascii "segoeui-changer-windows-x64.zip.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: segoeui-changer-windows-x64
          path: |
            segoeui-changer-windows-x64.zip
            segoeui-changer-windows-x64.zip.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            segoeui-changer-windows-x64.zip
            segoeui-changer-windows-x64.zip.sha256
          generate_release_notes: true

      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats
