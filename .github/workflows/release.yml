name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test & Clippy (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "check"

      - name: Run unit tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  release:
    name: Build & Package Release (Windows x64)
    needs: check
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release archive & SHA256
        shell: pwsh
        run: |
          $dist = "dist/typemod"
          New-Item -ItemType Directory -Force -Path "$dist" | Out-Null
          Copy-Item "target/release/typemod.exe" "$dist/"
          Copy-Item "README.md" "$dist/"
          Copy-Item "LICENSE" "$dist/"
          Copy-Item "THIRD_PARTY_LICENSES.md" "$dist/"
          Compress-Archive -Path "$dist/*" -DestinationPath "typemod-windows-x64.zip" -CompressionLevel Optimal -Force
          $hash = (Get-FileHash "typemod-windows-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  typemod-windows-x64.zip" | Out-File -Encoding ascii "typemod-windows-x64.zip.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: typemod-windows-x64
          path: |
            typemod-windows-x64.zip
            typemod-windows-x64.zip.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            typemod-windows-x64.zip
            typemod-windows-x64.zip.sha256
          generate_release_notes: true
